server {
  listen 8080;
  server_name _;
  root /var/www/html;
  index index.php;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header X-XSS-Protection "0" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS $http_x_forwarded_proto;
    fastcgi_pass app:9000;
    fastcgi_read_timeout 1h;
  }

  location ~* /(?:\.git|\.env|Dockerfile|docker-compose) {
    deny all;
  }

  location = /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
